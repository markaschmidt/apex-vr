<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-label="APEX-VR  Agentic Primitives for Extended Reality">
  <defs>
    <linearGradient id="void" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05040c"/>
      <stop offset="42%" stop-color="#0b0720"/>
      <stop offset="100%" stop-color="#12061c"/>
    </linearGradient>
    <radialGradient id="nebulaA" cx="18%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#3b1d6e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#05040c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="82%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.42"/>
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#05040c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="48%" r="38%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#05040c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f7ff"/>
      <stop offset="55%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#c4b5fd" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="520" fill="url(#void)"/>
  <rect width="1600" height="520" fill="url(#nebulaA)"/>
  <rect width="1600" height="520" fill="url(#nebulaB)"/>
  <rect width="1600" height="520" fill="url(#core)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <!-- HUD corners -->
  <g fill="none" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.4">
    <path d="M28 72V28H72"/>
    <path d="M1572 72V28H1528"/>
    <path d="M28 448V492H72"/>
    <path d="M1572 448V492H1528"/>
  </g>

  <!-- Starfield -->
  <g fill="#e0e7ff">
    <circle cx="86" cy="94" r="1.2" opacity="0.7"/>
    <circle cx="164" cy="188" r="0.9" opacity="0.45"/>
    <circle cx="240" cy="62" r="1.4" opacity="0.8"/>
    <circle cx="318" cy="410" r="1.1" opacity="0.55"/>
    <circle cx="402" cy="140" r="0.8" opacity="0.4"/>
    <circle cx="490" cy="38" r="1.3" opacity="0.7"/>
    <circle cx="1288" cy="84" r="1.2" opacity="0.65"/>
    <circle cx="1380" cy="166" r="0.9" opacity="0.5"/>
    <circle cx="1472" cy="58" r="1.5" opacity="0.85"/>
    <circle cx="1510" cy="320" r="1.1" opacity="0.55"/>
    <circle cx="1198" cy="448" r="0.8" opacity="0.4"/>
    <circle cx="980" cy="36" r="1.2" opacity="0.6"/>
    <circle cx="720" cy="478" r="1" opacity="0.5"/>
    <circle cx="110" cy="360" r="0.7" opacity="0.35"/>
    <circle cx="580" cy="300" r="0.9" opacity="0.3"/>
  </g>

  <!-- Orbital rings behind wordmark -->
  <g fill="none" transform="translate(800 258)">
    <ellipse rx="430" ry="132" stroke="url(#ring)" stroke-width="1.2" opacity="0.55"/>
    <ellipse rx="430" ry="132" stroke="#67e8f9" stroke-width="0.6" opacity="0.25" transform="rotate(18)"/>
    <ellipse rx="310" ry="92" stroke="#c4b5fd" stroke-width="0.8" opacity="0.35" transform="rotate(-12)"/>
    <circle r="4" fill="#67e8f9" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Procedural capsule agent (library default avatar) -->
  <g transform="translate(1320 168)" filter="url(#glow)">
    <ellipse cx="36" cy="188" rx="34" ry="8" fill="#06b6d4" opacity="0.18"/>
    <rect x="14" y="58" width="44" height="92" rx="22" fill="#8b5cf6"/>
    <circle cx="36" cy="34" r="22" fill="#c4b5fd"/>
    <circle cx="28" cy="30" r="4" fill="#0b0720"/>
    <circle cx="44" cy="30" r="4" fill="#0b0720"/>
    <circle cx="28" cy="30" r="1.6" fill="#67e8f9"/>
    <circle cx="44" cy="30" r="1.6" fill="#67e8f9"/>
    <rect x="2" y="78" width="16" height="54" rx="8" fill="#a78bfa" transform="rotate(-18 10 105)"/>
    <rect x="54" y="78" width="16" height="54" rx="8" fill="#a78bfa" transform="rotate(18 62 105)"/>
    <rect x="18" y="146" width="14" height="48" rx="7" fill="#6d28d9"/>
    <rect x="40" y="146" width="14" height="48" rx="7" fill="#6d28d9"/>
    <!-- listening halo -->
    <circle cx="36" cy="96" r="78" fill="none" stroke="#06b6d4" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="36" cy="96" r="96" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1"/>
  </g>

  <!-- Floating spatial pane -->
  <g transform="translate(118 150)" opacity="0.9">
    <rect x="0" y="0" width="168" height="108" rx="10" fill="#0b1024" stroke="#67e8f9" stroke-opacity="0.55" stroke-width="1.2"/>
    <rect x="12" y="14" width="96" height="8" rx="4" fill="#38bdf8" opacity="0.55"/>
    <rect x="12" y="32" width="144" height="6" rx="3" fill="#a78bfa" opacity="0.35"/>
    <rect x="12" y="46" width="128" height="6" rx="3" fill="#a78bfa" opacity="0.25"/>
    <rect x="12" y="60" width="110" height="6" rx="3" fill="#a78bfa" opacity="0.18"/>
    <rect x="12" y="80" width="52" height="16" rx="4" fill="#06b6d4" opacity="0.7"/>
    <text x="18" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#041016">INTENT</text>
  </g>

  <text x="800" y="228" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="10" fill="url(#word)">APEX-VR</text>
  <text x="800" y="278" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="7.2" fill="#c4b5fd">AGENTIC PRIMITIVES FOR EXTENDED REALITY</text>
  <text x="800" y="328" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" letter-spacing="3.4" fill="#94a3b8">VOCAL AGENTS · EMBODIED AVATARS · SPATIAL INTENTS · TOOL RAILS</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#67e8f9" letter-spacing="1.6">
    <text x="40" y="44">SYS // WEBXR</text>
    <text x="1368" y="44" text-anchor="end">PHASE: LISTENING</text>
    <text x="40" y="478">OPEN SOURCE · MIT</text>
    <text x="1560" y="478" text-anchor="end">v0.1 · PREVIEW</text>
  </g>
</svg>
